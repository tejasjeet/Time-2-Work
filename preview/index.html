<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Time2Work</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,0,0" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="desk">
    <div class="phone">
      <div class="phone-bezel">
        <div class="notch"></div>
        <div class="status-bar">
          <span id="clock">9:41</span>
          <span class="status-icons">5G ▮▮▮▮</span>
        </div>
        <div id="app" class="screen">
          <div class="page">
            <div class="center">
              <div class="logo"><span class="material-symbols-rounded">work</span></div>
              <h1>Time2Work</h1>
              <p class="muted">Kaam Bhi, Rojgar Bhi, Bazar Bhi</p>
              <div class="spinner" style="margin-top:20px"></div>
              <button type="button" class="btn" style="margin-top:28px;max-width:280px" onclick="if(window.go){go('onboarding')}else{location.href=location.href}">Get started / Shuru karein</button>
            </div>
          </div>
        </div>
        <div class="home-bar"></div>
      </div>
    </div>
    <p class="hint">This is the Time2Work phone UI, talking to your live API on :4000.<br />Worker <b>9999990001</b> · Business <b>9999990002</b> · OTP <b>123456</b></p>
  </div>
  <script>
    window.onerror = function (msg) {
      var el = document.getElementById("app");
      if (el) el.insertAdjacentHTML("beforeend", '<p class="err" style="padding:16px">' + msg + "</p>");
    };
  </script>
  <script src="app.js" onerror="document.getElementById('app').innerHTML='<div class=pad><h1>Could not load app.js</h1><p>Open http://localhost:5173 in Chrome.</p></div>'"></script>
</body>
</html>
