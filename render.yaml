# Render Blueprint — deploy Time2Work API (free tier)
# Repo: https://github.com/tejasjeet/Time-2-Work
#
# In Render dashboard set this env var when prompted:
#   MONGO_URI = mongodb+srv://...@time2work.o6cqvjq.mongodb.net/time2work
# GOOGLE_MAPS_API_KEY is optional (leave empty — OpenStreetMap fallback works).

services:
  - type: web
    name: time2work-api
    runtime: node
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: npm install --omit=dev
    startCommand: node src/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MOCK_OTP
        value: "true"
      - key: PAYMENTS_MODE
        value: mock
      - key: FIREBASE_ENABLED
        value: "false"
      - key: CORS_ORIGIN
        value: "*"
      - key: UPLOAD_DIR
        value: uploads
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
