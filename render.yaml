# Render Blueprint — deploy Time2Work API (free tier)
# Docs: https://render.com/docs/blueprint-spec
#
# 1. Push this repo to GitHub
# 2. Render Dashboard → New → Blueprint → connect repo
# 3. Set MONGO_URI when prompted (MongoDB Atlas connection string)
# 4. After deploy, seed Atlas once from your PC (see scripts/seed-cloud.ps1)

services:
  - type: web
    name: time2work-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4000"
      - key: MOCK_OTP
        value: "true"
      - key: PAYMENTS_MODE
        value: mock
      - key: FIREBASE_ENABLED
        value: "false"
      - key: CORS_ORIGIN
        value: "*"
      - key: UPLOAD_DIR
        value: uploads
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      # Optional — Google Places (Nominatim works without this)
      - key: GOOGLE_MAPS_API_KEY
        sync: false
