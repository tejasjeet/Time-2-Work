name: time2work
description: Time2Work — Kaam Bhi, Rojgar Bhi, Bazar Bhi. Hyperlocal job marketplace.
publish_to: "none"
version: 1.0.0+6

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  dio: ^5.7.0
  socket_io_client: ^2.0.3+1
  shared_preferences: ^2.3.3
  geolocator: ^13.0.2
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  intl: ^0.19.0
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  video_player: ^2.9.2
  timeago: ^3.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/images/logo.jpeg
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: assets/images/logo.jpeg

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.jpeg
    - assets/images/onboarding_art.png
    - assets/images/location_art.png
    - assets/images/empty_jobs_art.png
